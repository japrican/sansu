<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さんすうバトル｜学びのミカタ</title>
<meta name="description" content="先生とのチャットで「わかった！」、モンスターバトルで「できた！」。小学1〜6年生の算数アプリ。">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="さんすうバトル">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --paper:#f3f4fa; --card:#ffffff; --gray:#64748b; --line:#e6e8f0;
  --teal:#5b4bff; --primary:#5b4bff; --primary-d:#3f2fd9; --violet:#8b5cf6;
  --accent:#ff5c35; --accent-d:#d63e1a; --sun:#ffc21a; --red:#f43f5e; --red-d:#c81e45;
  --green:#12b76a; --green-d:#0a8a4f; --night:#14113a;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);height:100%}
body{font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:var(--ink);font-weight:700;
  font-feature-settings:"palt";letter-spacing:.01em;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-weight:800;border:none;cursor:pointer;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:40px}
.screen{display:none;padding:0 16px;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:8px}
.back{background:var(--card);border-radius:12px;padding:9px 14px;font-size:14px;box-shadow:var(--shadow);color:var(--ink)}
.pill{background:var(--card);border-radius:12px;padding:8px 13px;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);font-weight:800}
.pill .star{color:var(--sun)}
.sound{background:var(--card);border-radius:12px;width:40px;height:40px;font-size:17px;box-shadow:var(--shadow)}

/* trial banner */
.trial{background:var(--ink);color:white;border-radius:14px;padding:9px 10px 9px 14px;margin:12px 0 0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px}
.trial button{background:var(--accent);color:white;border-radius:10px;padding:8px 12px;font-size:13px;flex-shrink:0;box-shadow:0 3px 0 var(--accent-d)}
.trial.hide{display:none}

/* home */
.hero{background:radial-gradient(120% 140% at 100% 0%,#8b5cf6 0%,#5b4bff 45%,#3b2bd1 100%);color:white;border-radius:24px;padding:22px 18px 22px;margin-top:6px;
  position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(91,75,255,.35)}
.hero::before{content:'+ − × ÷ = + − × ÷ = + − ×';position:absolute;inset:-10px -20px auto auto;font-size:44px;font-weight:800;opacity:.08;
  width:320px;line-height:1.15;word-break:break-all;transform:rotate(-12deg);right:-40px;top:-10px}
.hero h1{font-size:30px;font-weight:800;line-height:1.2;position:relative;z-index:1;letter-spacing:.02em}
.hero h1 small{display:table;font-size:11.5px;letter-spacing:.08em;margin-bottom:8px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:100px}
.hero p{font-size:13.5px;line-height:1.65;margin-top:10px;opacity:.9;position:relative;z-index:1;font-weight:500}
.hero .owl{width:96px;flex-shrink:0;position:relative;z-index:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
.h2{font-size:17px;font-weight:800;margin:26px 0 12px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{background:var(--gc);color:white;border-radius:18px;padding:14px 6px 12px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 65%,black);transition:transform .1s,box-shadow .1s}
.grade::after{content:'';position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16)}
.grade:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--gc) 65%,black)}
.grade b{display:block;font-size:32px;line-height:1;font-weight:800}
.grade span{display:block;font-size:12.5px;margin-top:4px;opacity:.92}
.grade em{display:inline-block;font-style:normal;font-size:12px;margin-top:8px;background:rgba(0,0,0,.18);padding:3px 9px;border-radius:100px}
.zukan-btn{width:100%;margin-top:14px;background:var(--card);border-radius:18px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;font-size:16px;text-align:left;box-shadow:var(--shadow)}
.zukan-btn .mini{display:flex;padding-left:8px}
.zukan-btn .mini svg{width:36px;height:36px;margin-left:-8px}
.zukan-btn small{display:block;font-size:12.5px;color:var(--gray);font-weight:600}
.portal-link{display:block;text-align:center;margin-top:26px;font-size:13px;color:var(--primary)}

/* map */
.map-head{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.map-head h2{font-size:24px;font-weight:800}
.map-head p{font-size:13px;color:var(--gray);font-weight:500;margin-top:2px}
.path{position:relative;padding:6px 0 20px}
.stage{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;position:relative;
  padding:12px 14px;margin:12px 0;width:100%;box-shadow:var(--shadow);text-align:left;transition:transform .1s}
.stage:active{transform:scale(.98)}
.stage.lock{opacity:.55}
.stage.lock .mon{filter:grayscale(1)}
.stage .mon{width:60px;height:60px;flex-shrink:0;background:var(--paper);border-radius:16px;padding:4px}
.stage .no{font-size:11.5px;color:var(--primary);letter-spacing:.06em}
.stage .ttl{font-size:16.5px;font-weight:800;line-height:1.35}
.stage .stars{font-size:15px;color:#d9dce6;letter-spacing:2px;margin-top:2px}
.stage .stars .on{color:var(--sun)}

/* chat lesson */
.lesson-title{font-size:12px;color:var(--primary);margin:4px 0 2px;letter-spacing:.06em}
.lesson-h{font-size:22px;font-weight:800;margin-bottom:12px}
.chat{background:var(--card);border-radius:22px;padding:16px 12px;min-height:320px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px;animation:pop .3s ease}
.row.kid{flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.face{width:40px;height:40px;flex-shrink:0;border-radius:50%;overflow:hidden;background:#fff4d6}
.face.kidf{background:var(--ink);color:white;display:flex;align-items:center;justify-content:center;font-size:13px}
.bub{font-size:16.5px;line-height:1.7;padding:11px 15px;border-radius:20px;max-width:82%;font-weight:600}
.row.owlr .bub{background:#f1f2f8;border-bottom-left-radius:6px}
.row.kid .bub{background:var(--primary);color:white;border-bottom-right-radius:6px}
.bub .em{color:var(--accent);font-weight:800}
.row.kid .bub .em{color:#ffe066}
.bub .big{font-size:21px;font-weight:800;letter-spacing:.03em}
.next{width:100%;margin-top:14px;background:var(--primary);color:white;border-radius:16px;padding:16px;font-size:17px;
  box-shadow:0 5px 0 var(--primary-d);transition:transform .08s,box-shadow .08s}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d)}
.next.go{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.next.go:active{box-shadow:0 1px 0 var(--green-d)}
.skip{display:block;margin:12px auto 0;background:none;font-size:13.5px;color:var(--gray);text-decoration:underline;font-weight:600}

/* battle */
.arena{background:radial-gradient(110% 90% at 50% 10%,#3a2fa8 0%,#1f1863 55%,var(--night) 100%);color:white;border-radius:24px;
  padding:14px 16px 16px;text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(20,17,58,.35)}
.arena::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);background-size:36px 36px;opacity:.25}
.arena>*{position:relative}
.bar-row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.bar-row #bName{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:100px;font-size:13px}
.hearts{font-size:19px;letter-spacing:2px}
.hp{height:12px;background:rgba(255,255,255,.14);border-radius:100px;overflow:hidden;margin:10px 0 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d71,#ff9f43);border-radius:100px;transition:width .4s;box-shadow:0 0 12px rgba(255,93,93,.8)}
.monster{width:150px;height:150px;margin:12px auto 0;transition:transform .2s;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.monster.hit{animation:hit .4s}
.monster.atk{animation:atk .4s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg)}50%{transform:translateX(10px) rotate(5deg);filter:brightness(1.8)}}
@keyframes atk{0%,100%{transform:none}40%{transform:scale(1.18) translateY(12px)}}
.monster.gone{animation:gone .6s forwards}
@keyframes gone{to{transform:scale(0) rotate(200deg);opacity:0}}
.q{background:var(--card);border-radius:20px;padding:16px 10px;margin-top:12px;min-height:84px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.q .qm{font-size:32px;font-weight:800;line-height:1.35;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.q .qm.sm{font-size:19px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 6px;font-size:24px;min-height:72px;font-weight:800;
  box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .08s,box-shadow .08s}
.opt.sm{font-size:18px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--green);border-color:var(--green);color:white;box-shadow:0 4px 0 var(--green-d)}
.opt.ng{background:var(--red);border-color:var(--red);color:white;box-shadow:0 4px 0 var(--red-d)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-radius:18px;padding:14px;font-size:15px;line-height:1.7;text-align:left;display:none;font-weight:600}
.fb.show{display:block;animation:pop .25s}
.fb.good{background:#e7f8ef;color:#065f46}
.fb.bad{background:#fff0f3;color:#9f1239;border:2px solid #ffd0da}
.fb b{font-weight:800}
.fb .next{margin-top:12px;padding:13px;font-size:16px}
.pow{position:absolute;left:50%;top:40%;font-size:42px;font-weight:800;color:#ffe066;transform:translate(-50%,-50%);
  pointer-events:none;animation:powup .7s forwards;text-shadow:0 3px 0 #d63e1a,0 0 20px rgba(255,200,0,.6)}
@keyframes powup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

/* fraction */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px}
.fr>span{display:block;padding:0 3px}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding-bottom:3px}
.fr>span:last-child{padding-top:3px}
.q .qm .fr{font-size:27px}
.opt .fr{font-size:20px}

/* result */
.result{text-align:center;padding-top:20px}
.result h2{font-size:32px;font-weight:800;margin-top:8px}
.bigstars{font-size:56px;letter-spacing:6px;margin:10px 0;color:#d9dce6}
.bigstars span{display:inline-block}
.bigstars .on{color:var(--sun);animation:starin .5s backwards;text-shadow:0 4px 0 #e0a100}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.newfriend{background:var(--night);color:white;border-radius:22px;padding:16px;margin:14px 0;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 10px 24px rgba(20,17,58,.3)}
.newfriend svg{width:80px;height:80px;flex-shrink:0}
.newfriend b{font-size:17px;display:block}
.newfriend small{font-size:13px;opacity:.8;line-height:1.6;display:block;margin-top:2px;font-weight:500}
.btn2{width:100%;margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:15.5px;box-shadow:0 4px 0 var(--line)}
.btn2:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.confetti{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zc{background:var(--card);border-radius:18px;padding:10px 4px;text-align:center;font-size:12px;position:relative;box-shadow:var(--shadow)}
.zc svg{width:70px;height:70px}
.zc.no{background:#eceef5;box-shadow:none}
.zc.no svg{filter:brightness(0) opacity(.12)}
.zc.shiny{background:var(--night);color:white}
.zc.shiny::after{content:'★';position:absolute;top:5px;right:9px;color:var(--sun);font-size:14px}
.zc .zn{display:block;margin-top:2px;line-height:1.4}
.ztip{font-size:13.5px;color:var(--gray);line-height:1.7;margin-bottom:12px;font-weight:500}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ovbox{background:var(--card);border-radius:24px;padding:24px 20px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ovbox h3{font-size:20px;font-weight:800;margin:8px 0 8px;line-height:1.4}
.ovbox p{font-size:14.5px;line-height:1.75;color:#475569;font-weight:500}
.ovbox .price{font-size:34px;font-weight:800;margin:12px 0 2px}
.ovbox .price small{font-size:14px}
.ovbox .note{font-size:12.5px;color:var(--gray);margin-top:6px;font-weight:500}
.ovbox .next{margin-top:14px;background:var(--accent);box-shadow:0 5px 0 var(--accent-d)}
.ovbox .owl{width:80px;margin:0 auto}

/* ===== THEME：そらいろ（タブレット学習風・目にやさしい） ===== */
:root{
  --ink:#24324a; --paper:#f3f7fc; --card:#ffffff; --gray:#6b7a90; --line:#e2e9f3;
  --teal:#3d8bf2; --primary:#3d8bf2; --primary-d:#2a6fd0; --violet:#7c8cf8;
  --accent:#ff8a5b; --accent-d:#e2683a; --sun:#ffc531; --red:#ff6b6b; --red-d:#de4c4c;
  --green:#2fbf71; --green-d:#22985a; --night:#2f6fb8;
  --shadow:0 1px 2px rgba(36,50,74,.05),0 6px 18px rgba(61,139,242,.08);
}
body{background:var(--paper)}
.trial{background:#fff4d1;color:#8a5a00;border:1.5px solid #ffe3a0}
.trial button{background:var(--accent);box-shadow:0 3px 0 var(--accent-d)}
.hero{background:linear-gradient(160deg,#58a8ff 0%,#3d8bf2 55%,#4f7cf0 100%);box-shadow:0 12px 26px rgba(61,139,242,.28)}
.hero::before{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#ffe27a 0 38%,rgba(255,226,122,.0) 39%),radial-gradient(circle,rgba(255,255,255,.18) 0 60%,transparent 61%);
  opacity:1;transform:none;font-size:0;line-height:0}
.hero::after{content:'';position:absolute;left:-20px;bottom:-26px;width:190px;height:60px;border-radius:60px;background:rgba(255,255,255,.22);
  box-shadow:120px 14px 0 -6px rgba(255,255,255,.16)}
.hero h1 small{background:rgba(255,255,255,.22)}
.grade{box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 72%,#24324a)}
.grade:active{box-shadow:0 1px 0 color-mix(in srgb,var(--gc) 72%,#24324a)}
.grade em{background:rgba(255,255,255,.25)}
/* きょうのミッション */
.mission{width:100%;margin-top:16px;background:var(--card);border-radius:22px;padding:14px 14px 14px 12px;display:flex;align-items:center;gap:12px;
  text-align:left;box-shadow:0 0 0 2.5px #ffd65c inset,0 6px 0 #ffe7a3;position:relative;overflow:hidden}
.mission::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);
  transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.mission .mmon{width:62px;height:62px;flex-shrink:0;background:#fff8e1;border-radius:18px;padding:4px}
.mission .mlab{font-size:12px;color:#c08a00;letter-spacing:.06em}
.mission .mttl{font-size:16.5px;font-weight:800;line-height:1.35}
.mission .mgo{margin-left:auto;flex-shrink:0;background:var(--accent);color:#fff;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:800;box-shadow:0 4px 0 var(--accent-d)}
/* バトル：昼の空 */
.arena{background:linear-gradient(180deg,#8fd0ff 0%,#c8ebff 70%,#e9f7ff 100%);color:var(--ink);box-shadow:0 10px 24px rgba(61,139,242,.2)}
.arena::before{background-image:radial-gradient(ellipse 60px 22px at 18% 30%,rgba(255,255,255,.85) 98%,transparent 100%),radial-gradient(ellipse 80px 26px at 80% 18%,rgba(255,255,255,.75) 98%,transparent 100%);
  background-size:auto;opacity:1}
.bar-row #bName{background:rgba(255,255,255,.7);color:var(--ink)}
.hp{background:rgba(36,50,74,.12)}
.hp i{background:linear-gradient(90deg,#ff7b7b,#ffb35c);box-shadow:none}
.monster{filter:drop-shadow(0 10px 10px rgba(36,50,74,.18))}
.pow{color:#fff;text-shadow:0 3px 0 var(--accent-d),0 0 14px rgba(255,138,91,.7)}
.opt{border-color:var(--line);box-shadow:0 4px 0 var(--line)}
/* ごほうび */
.newfriend{background:linear-gradient(135deg,#fff7d6,#ffe9f2 60%,#e6f3ff);color:var(--ink);box-shadow:0 0 0 2.5px #ffd65c inset}
.newfriend small{opacity:1;color:var(--gray)}
.zc.shiny{background:linear-gradient(150deg,#fff3c4,#ffe3ef 55%,#dff0ff);color:var(--ink)}
.bigstars .on{text-shadow:0 4px 0 #e5a400}
.face.kidf{background:#ffe4d6;color:#d2602f}
.row.kid .bub{background:var(--primary)}
.ovbox .next{background:var(--accent);box-shadow:0 5px 0 var(--accent-d)}
.setbox{position:relative;margin-top:16px;padding:16px 14px 14px;border-radius:18px;background:#fff8e1;box-shadow:0 0 0 2px #ffd65c inset;text-align:center}
.setbox .setbadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:100px;white-space:nowrap}
.setbox b{display:block;font-size:17px;font-weight:800}
.setbox small{display:block;font-size:12.5px;color:var(--gray);line-height:1.6;margin-top:4px;font-weight:600}
.setbox em{font-style:normal;color:var(--accent-d);font-weight:800}
.ovbox .next.setbtn{margin-top:10px;background:#ffc531;color:#3a2a00;box-shadow:0 5px 0 #d9a100}
.ovbox{max-height:92vh;overflow:auto}

/* ===== THEME DUO（デュオリンゴ／タブレット学習風・絵文字なし） ===== */
:root{
  --ink:#3c3c3c; --body:#4b4b4b; --paper:#ffffff; --card:#ffffff; --gray:#777777; --line:#e5e5e5;
  --teal:#1cb0f6; --primary:#1cb0f6; --primary-d:#1899d6;
  --accent:#ff9600; --accent-d:#cc7700; --sun:#ffc800; --sun-d:#e5a500;
  --red:#ff4b4b; --red-d:#ea2b2b; --green:#58cc02; --green-d:#58a700; --night:#1cb0f6;
  --round:'M PLUS Rounded 1c','BIZ UDPGothic',sans-serif; --kyo:'UD デジタル 教科書体 NK-R','UD Digital Kyokasho NK-R','Klee One','BIZ UDPGothic',serif;
  --shadow:none;
}
html,body{background:#fff}
body{font-family:'BIZ UDPGothic','Hiragino Sans',sans-serif;color:var(--body);font-weight:700;letter-spacing:.01em}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
h1,h2,.h2,.lesson-h,.map-head h2,.result h2,.ovbox h3,.next,.btn2,.back,.pill,.gtab b,.unit-banner b,.nbub,.nttl,.opt,.stage .ttl{font-family:var(--round);font-weight:800}
.app{padding-bottom:110px}
/* 古いホーム要素は使わない */
#sHome .hero,#sHome .mission,#sHome .h2,#sHome #grades,#sHome .zukan-btn{display:none!important}
#sHome .topbar .back{display:none}
.topbar{padding:12px 0 6px}
.pill,.sound,.back{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;box-shadow:none}
.pill .star,.pill .ic{color:var(--sun)}
.sound{color:var(--primary);font-size:20px;display:flex;align-items:center;justify-content:center}
.back:active,.pill:active,.sound:active{transform:translateY(2px);border-bottom-width:2px}
.trial{background:#fff4d6;border:2px solid #ffe1a1;color:#9a5b00;border-radius:14px}
.trial button{background:var(--accent);box-shadow:0 4px 0 var(--accent-d);border-radius:12px}
/* 学年タブ */
.gtabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;min-width:64px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 10px 6px;text-align:center;color:var(--gray)}
.gtab b{display:block;font-size:17px;color:var(--ink)}
.gtab i{display:block;font-style:normal;font-size:11px}
.gtab.on{background:var(--gc);border-color:color-mix(in srgb,var(--gc) 78%,#000);color:#fff}
.gtab.on b{color:#fff}
.gtab:active{transform:translateY(2px);border-bottom-width:2px}
/* ユニットの帯 */
.unit-banner{background:var(--gc);color:#fff;border-radius:18px;padding:16px 16px 16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--gc) 75%,#000);margin:4px 0 6px}
.unit-banner small{display:block;font-size:13px;opacity:.9}
.unit-banner b{display:block;font-size:20px;line-height:1.3;margin:2px 0 4px}
.unit-banner span{font-size:13px;opacity:.95}
.unit-banner button{margin-left:auto;flex-shrink:0;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
/* 学習パス */
.dpath{display:flex;flex-direction:column;align-items:center;padding:64px 0 10px;gap:14px}
.nrow{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x));width:170px}
.node{width:76px;height:72px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;transition:transform .1s}
.node.cur,.node.open{background:var(--gc);box-shadow:0 7px 0 color-mix(in srgb,var(--gc) 72%,#000)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node.lock{background:#e5e5e5;color:#afafaf;box-shadow:0 7px 0 #cecece}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.node.cur{outline:6px solid color-mix(in srgb,var(--gc) 22%,#fff);outline-offset:4px}
.nbub{position:absolute;top:-44px;background:#fff;color:var(--gc,var(--primary));border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.nbub::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nstars{display:flex;gap:2px;margin-top:10px;font-size:15px;color:#e5e5e5}
.nstars .on{color:var(--sun)}
.nttl{font-size:13px;color:var(--ink);text-align:center;line-height:1.35;margin-top:2px;max-width:160px}
.nmon{position:absolute;top:0;width:86px;height:86px}
.nmon.l{right:150px}.nmon.r{left:150px}
.nmon.dim{filter:grayscale(1) opacity(.35)}
/* 下のナビ */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--line);display:none;justify-content:center;gap:4px;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
body.navon .bnav{display:flex}
.bnav button,.bnav a{flex:1;max-width:150px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--gray);text-decoration:none;font-family:var(--round);font-weight:800}
.bnav .bi{font-size:24px;line-height:1;color:#afafaf}
.bnav .on{border-color:#84d8ff;background:#ddf4ff;color:var(--primary-d)}
.bnav .on .bi{color:var(--primary)}
/* チャット */
.lesson-title{color:var(--primary-d);font-family:'BIZ UDPGothic',sans-serif}
.chat{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:none}
.bub{font-family:var(--kyo);font-weight:600;font-size:18px}
.row.owlr .bub{background:#fff;border:2px solid var(--line)}
.row.kid .bub{background:var(--primary)}
.face{background:#fff4d6}
.face.kidf{background:#ddf4ff;color:var(--primary-d);font-family:var(--round)}
.next{background:var(--primary);box-shadow:0 4px 0 var(--primary-d);border-radius:16px;letter-spacing:.04em}
.next:active{box-shadow:none;transform:translateY(4px)}
.next.go{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.skip{font-family:'BIZ UDPGothic',sans-serif}
/* バトル */
.arena{background:#ddf4ff;color:var(--ink);border:2px solid #b9e6ff;border-bottom-width:4px;box-shadow:none}
.arena::before{display:none}
.bar-row #bName{background:#fff;color:var(--ink);border:2px solid var(--line);font-family:var(--round)}
.hearts{display:flex;gap:2px;font-size:22px}
.hearts .hon{color:var(--red)}.hearts .hoff{color:#d9d9d9}
.hp{background:#fff;border:2px solid #b9e6ff;height:16px}
.hp i{background:var(--red);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.monster{filter:none}
.q{border:2px solid var(--line);box-shadow:none}
.q .qm{font-family:var(--kyo);font-weight:600}
.opt{border:2px solid var(--line);border-bottom-width:4px;box-shadow:none;border-radius:16px;color:var(--ink)}
.opt:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.opt.ok{background:#d7ffb8;border-color:var(--green);color:var(--green-d);box-shadow:none}
.opt.ng{background:#ffdfe0;border-color:var(--red);color:var(--red-d);box-shadow:none}
.fb.bad{background:#ffdfe0;color:var(--red-d);border:0}
.fb.good{background:#d7ffb8;color:var(--green-d)}
.pow{color:var(--sun);text-shadow:0 3px 0 var(--accent-d)}
/* 結果・ずかん */
.bigstars{color:#e5e5e5}.bigstars .on{color:var(--sun);text-shadow:0 4px 0 var(--sun-d)}
.newfriend{background:#fff;border:2px solid var(--line);border-bottom-width:4px;box-shadow:none;color:var(--ink)}
.btn2{border:2px solid var(--line);border-bottom-width:4px;box-shadow:none;border-radius:16px;color:var(--primary-d)}
.zc{border:2px solid var(--line);border-bottom-width:4px;box-shadow:none}
.zc.no{background:#f7f7f7;border-color:#efefef}
.zc.shiny{background:#fff4d6;border-color:#ffd15c}
.ovbox{border-radius:20px}
.ovbox .next{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.ovbox .next.setbtn{background:var(--sun);color:#3c3c3c;box-shadow:0 4px 0 var(--sun-d)}
.setbox{background:#fff;border:2px solid #ffd15c;border-bottom-width:4px;box-shadow:none}
.setbox .setbadge{background:var(--accent)}
.spk{background:var(--primary);box-shadow:0 4px 0 var(--primary-d);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.row.kid .bub .em{color:#fff;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
</style>
</head>
<body>

  <div id="trial" class="trial hide"><span id="trialText"></span><button onclick="openBuy(false)">購入する</button></div>

  <!-- HOME -->

  <!-- MAP -->
  <section class="screen" id="sMap">

  <!-- LESSON -->

  <!-- BATTLE -->
  <section class="screen" id="sBattle">

    <div class="arena" id="arena">
      <div class="bar-row"><span class="hearts" id="hearts"></span><span id="bName"></span></div>
      <div class="hp"><i id="hpBar" style="width:100%"></i></div>
      <div class="monster" id="monster"></div>
    </div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="sResult">
    <div class="result" id="result"></div>
  </section>

  <!-- ZUKAN -->
  <section class="screen" id="sZukan">
    <div class="topbar">
      <button class="back" onclick="go('sHome')">← もどる</button>
      <div class="pill" id="zPill"></div>
    </div>
    <div class="h2" style="margin-top:4px">なかまずかん</div>
    <p class="ztip">モンスターをたおすと なかまになるよ。ノーミス（★3つ）でクリアすると、キラキラのすがたになるよ！</p>
    <div class="zgrid" id="zgrid"></div>

</div>


<nav class="bnav" id="bnav">
  <button data-go="home" onclick="go('sHome')"><span class="bi" data-ic="home"></span>まなぶ</button>
  <button data-go="zukan" onclick="showZukan()"><span class="bi" data-ic="paw"></span>ずかん</button>
  <a href="https://manabino-mikata.com/portal/"><span class="bi" data-ic="grid"></span>ほかの教科</a>
</nav>
<!-- 購入オーバーレイ -->
<div class="ov" id="ovBuy">
  <div class="ovbox">
    <div class="owl" id="ovOwl"></div>
    <h3 id="ovH"></h3>

      <div class="setbadge">いちばんお得</div>

    </div>

    <button class="skip" onclick="restoreHelp()">購入済みの方はこちら</button>
  </div>
</div>

<script>
/* ===================== 設定 ===================== */
const APP_ID = 'sansu';
// ▼ Stripeで「さんすうバトル」の決済リンクを作ったら、ここを差し替えてください
const STRIPE_URL = 'https://buy.stripe.com/6oU5kw3wYfHCcyo0zQ5wI08';
// ▼ Stripeの「支払い後のリダイレクト先」は https://japrican.github.io/sansu/?paid=1 にしてください
// ▼ 小学生6教科セットの決済リンク（6本とも同じURL）。支払い後のリダイレクト先は https://manabino-mikata.com/sansu/?paid=sho
const STRIPE_SET_URL = 'https://buy.stripe.com/3cI3co2sU0MI2XOdmC5wI0e';
const TRIAL_DAYS = 7;
const CONTACT = 'studypartnerforkids@gmail.com';

/* ===================== 体験版・購入 ===================== */
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
(function handlePaid(){
  const p=new URLSearchParams(location.search);
  if(p.get('paid')==='1'){ls('app_unlocked_'+APP_ID,'1');history.replaceState(null,'',location.pathname);window.__justPaid=true}
  if(p.get('paid')==='sho'){ls('bundle_sho_unlocked_v1','1');history.replaceState(null,'',location.pathname);window.__justPaid='set'}
})();
function isUnlocked(){return ls('app_unlocked_'+APP_ID)==='1'||ls('bundle_sho_unlocked_v1')==='1'}
function trialStart(){
  let t=parseInt(ls('app_trial_start_'+APP_ID),10);
  if(!t){t=Date.now();ls('app_trial_start_'+APP_ID,String(t))}
  return t;
}
function daysLeft(){return Math.max(0,Math.ceil(TRIAL_DAYS-(Date.now()-trialStart())/86400000))}
function trialOver(){return !isUnlocked()&&daysLeft()<=0}
function showTrialBanner(){
  const el=document.getElementById('trial');
  if(isUnlocked()){el.classList.add('hide');return}
  const d=daysLeft();
  document.getElementById('trialText').textContent=d>0?`無料体験中：のこり${d}日`:'無料体験がおわりました';
  el.classList.remove('hide');
}
function openBuy(expired){
  document.getElementById('ovH').textContent=expired?'無料体験はおわりました':'ずっと遊べるようにする';
  document.getElementById('ovP').textContent=expired
    ?'7日間あそんでくれてありがとう！ つづきは、おうちの人といっしょに購入してね。進みぐあいやなかまは、そのまま残っています。'
    :'購入すると、体験期間が終わっても、1〜6年生の全ステージでずっと遊べます。';
  document.getElementById('ovClose').style.display=expired?'none':'block';
  document.getElementById('buyArea').style.display='block';
  document.getElementById('ovBuy').classList.add('on');
}
function closeBuy(){document.getElementById('ovBuy').classList.remove('on')}
function goBuy(){location.href=STRIPE_URL}
function goBuySet(){location.href=STRIPE_SET_URL}
function restoreHelp(){
  alertBox('購入済みの方へ',`購入したときと同じ端末・ブラウザで開いてください。別の端末で使いたいときや、うまく開けないときは、購入時のメールを添えて ${CONTACT} までご連絡ください。`);
}
function alertBox(h,p){
  document.getElementById('buyArea').style.display='none';
  document.getElementById('ovH').textContent=h;document.getElementById('ovP').textContent=p;
  document.getElementById('ovClose').style.display='block';
  document.getElementById('ovBuy').classList.add('on');
}
function guard(){if(trialOver()){openBuy(true);return false}return true}


/* ===================== アイコン（SVG） ===================== */
const IC={
 star:'<svg viewBox="0 0 24 24" class="ic"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="currentColor"/></svg>',
 heart:'<svg viewBox="0 0 24 24" class="ic"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>',
 sound:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
 mute:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
 play:'<svg viewBox="0 0 24 24" class="ic"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
 lock:'<svg viewBox="0 0 24 24" class="ic"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 018 0v2.5" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>',
 check:'<svg viewBox="0 0 24 24" class="ic"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 home:'<svg viewBox="0 0 24 24" class="ic"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 01-1 1h-5v-6h-5v6h-5a1 1 0 01-1-1z" fill="currentColor"/></svg>',
 book:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 014 18.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z" fill="currentColor"/></svg>',
 grid:'<svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="4" y="13" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="13" width="7" height="7" rx="2" fill="currentColor"/></svg>',
 paw:'<svg viewBox="0 0 24 24" class="ic"><ellipse cx="12" cy="15.5" rx="5" ry="4.2" fill="currentColor"/><circle cx="6" cy="10" r="2.2" fill="currentColor"/><circle cx="9.5" cy="6.5" r="2.2" fill="currentColor"/><circle cx="14.5" cy="6.5" r="2.2" fill="currentColor"/><circle cx="18" cy="10" r="2.2" fill="currentColor"/></svg>',
 gift:'<svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="9" width="17" height="4" rx="1" fill="currentColor"/><rect x="5" y="13" width="14" height="7.5" rx="1" fill="currentColor"/><path d="M12 9v11.5" stroke="#fff" stroke-width="2"/><path d="M12 9c-1.5-3-5-4-5-1.5S10 9 12 9zm0 0c1.5-3 5-4 5-1.5S14 9 12 9z" fill="currentColor"/></svg>'
};
/* ===================== 音 ===================== */
let soundOn=ls('sansu_sound')!=='0',actx=null;
function toggleSound(){soundOn=!soundOn;ls('sansu_sound',soundOn?'1':'0');document.getElementById('soundBtn').innerHTML=soundOn?IC.sound:IC.mute}
function beep(type){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.08],[880,.12]],ng:[[260,.18]],win:[[523,.1],[659,.1],[784,.1],[1047,.25]],tap:[[500,.04]]}[type];
    let t=actx.currentTime;
    seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type==='ng'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d});
  }catch(e){}
}

/* ===================== 数字ヘルパー ===================== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const fr=(n,d)=>{const g=gcd(n,d);return (d/g===1)?String(n/g):`${n/g}/${d/g}`};   // 約分した分数の文字列
const dec=t=>{const s=(t/10).toFixed(1);return s.endsWith('.0')?s.slice(0,-2):s};      // 10分の1単位の整数 → 小数文字列
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 分数「a/b」を縦書きに

// 選択肢：正解 + まちがい候補 から4つ
function opts(ans,cands,fill){
  const set=[String(ans)];
  for(const c of cands){const s=String(c);if(!set.includes(s)&&s!==''&&!/^-|NaN|undefined/.test(s))set.push(s);if(set.length===4)break}
  let guard=0;while(set.length<4&&guard++<200){const s=String(fill());if(!set.includes(s)&&!/^-|NaN/.test(s))set.push(s)}
  return shuffle(set);
}

function owlSVG(){return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="60" rx="34" ry="36" fill="#a16207"/><ellipse cx="50" cy="66" rx="22" ry="26" fill="#fde68a"/>

<circle cx="38" cy="43" r="6" fill="#1c2b2a"/><circle cx="62" cy="43" r="6" fill="#1c2b2a"/><circle cx="40" cy="41" r="2" fill="white"/><circle cx="64" cy="41" r="2" fill="white"/>
<path d="M45 52 L55 52 L50 60Z" fill="#f97316"/><circle cx="36" cy="42" r="15" fill="none" stroke="#1c2b2a" stroke-width="2.5"/><circle cx="64" cy="42" r="15" fill="none" stroke="#1c2b2a" stroke-width="2.5"/><path d="M51 42h-2" stroke="#1c2b2a" stroke-width="2.5"/></svg>`}
function monSVG(u,shiny){
  const h=u.hue,c1=`hsl(${h},88%,${shiny?62:57}%)`,c2=`hsl(${h},95%,${shiny?82:76}%)`,c3=`hsl(${h},75%,30%)`,v=u.id%4;
  const body=[
    `<path d="M50 12 C80 12 90 40 88 62 C86 84 70 92 50 92 C30 92 14 84 12 62 C10 40 20 12 50 12Z" fill="${c1}"/>`,
    `<rect x="14" y="20" width="72" height="70" rx="26" fill="${c1}"/><path d="M26 22 L32 6 L40 22Z M60 22 L68 6 L74 22Z" fill="${c3}"/>`,
    `<path d="M50 8 L90 86 Q50 98 10 86Z" fill="${c1}" stroke="${c1}" stroke-width="10" stroke-linejoin="round"/>`,
    `<circle cx="50" cy="56" r="38" fill="${c1}"/><circle cx="22" cy="24" r="10" fill="${c1}"/><circle cx="78" cy="24" r="10" fill="${c1}"/><circle cx="22" cy="24" r="5" fill="${c2}"/><circle cx="78" cy="24" r="5" fill="${c2}"/>`][v];
  const eyes=u.id%3===0?`<circle cx="50" cy="50" r="13" fill="white"/><circle cx="52" cy="51" r="6" fill="#1c2b2a"/><circle cx="54" cy="48" r="2" fill="white"/>`
    :`<circle cx="38" cy="50" r="9" fill="white"/><circle cx="62" cy="50" r="9" fill="white"/><circle cx="39" cy="51" r="4.5" fill="#1c2b2a"/><circle cx="63" cy="51" r="4.5" fill="#1c2b2a"/><circle cx="40" cy="49" r="1.6" fill="white"/><circle cx="64" cy="49" r="1.6" fill="white"/>`;
  const mouth=u.id%2?`<path d="M40 68 Q50 78 60 68" stroke="#1c2b2a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M44 69 L46 74 L48 70Z" fill="white"/>`
    :`<path d="M42 68 Q50 74 58 68" stroke="#1c2b2a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const sym=['+','−','×','÷','%','=','<','√'][u.id%8];
  const sparkle=shiny?`<path d="M84 10 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3Z" fill="#fbbf24"/><path d="M14 74 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z" fill="#fbbf24"/>`:'';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${body}<ellipse cx="50" cy="80" rx="18" ry="8" fill="${c2}"/>

<text x="50" y="88" text-anchor="middle" font-size="14" font-weight="900" fill="${c3}" font-family="sans-serif">${sym}</text>${sparkle}</svg>`;
}

/* ===================== バトル ===================== */
const QN=8,LIVES=3;let B=null;
function startBattle(){
  if(!guard())return;
  const u=cur.u;B={u,i:0,miss:0,lives:LIVES,busy:false};
  document.getElementById('bName').textContent=u.m;
  const m=document.getElementById('monster');m.className='monster';m.innerHTML=monSVG(u,false);
  go('sBattle');nextQ();
}
function drawStatus(){
  document.getElementById('hearts').innerHTML=('<span class="hon">'+IC.heart+'</span>').repeat(B.lives)+('<span class="hoff">'+IC.heart+'</span>').repeat(LIVES-B.lives);
  document.getElementById('hpBar').style.width=((QN-B.i)/QN*100)+'%';
  document.getElementById('qCount').textContent=`${Math.min(B.i+1,QN)} / ${QN}もん`;
}
function nextQ(){
  if(B.i>=QN)return win();
  let p,tries=0;do{p=B.u.gen()}while((p.q===B.lastQ)&&tries++<10);B.lastQ=p.q;B.p=p;B.busy=false;
  drawStatus();
  document.getElementById('q').innerHTML=`<div class="qm ${p.sm?'sm':''}">${fmt(p.q)}</div>`;
  document.getElementById('opts').innerHTML=p.o.map(o=>`<button class="opt ${p.small?'sm':''}" data-v="${o}">${fmt(o)}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
}
function pow(t){const a=document.getElementById('arena'),e=document.createElement('div');e.className='pow';e.textContent=t;a.appendChild(e);setTimeout(()=>e.remove(),700)}
function answer(btn){
  if(B.busy)return;B.busy=true;
  const ok=btn.dataset.v===String(B.p.a);
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===String(B.p.a))b.classList.add('ok')});
  const m=document.getElementById('monster'),fb=document.getElementById('fb');
  if(ok){
    beep('ok');B.i++;m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');pow(pick(['ドーン！','バシッ！','ズバッ！','やった！']));drawStatus();
    setTimeout(()=>{B.i>=QN?win():nextQ()},750);
  }else{
    beep('ng');btn.classList.add('ng');B.miss++;B.lives--;m.classList.remove('atk');void m.offsetWidth;m.classList.add('atk');drawStatus();
    fb.className='fb bad show';
    fb.innerHTML=`<b>おしい！ こたえは ${fmt(B.p.a)}</b><br>${fmt(B.p.x)}<button class="next" onclick="${B.lives<=0?'lose()':'nextQ()'}">${B.lives<=0?'けっかを見る':'つぎの もんだい ▶'}</button>`;
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function win(){
  const m=document.getElementById('monster');m.classList.add('gone');beep('win');
  const u=B.u,stars=B.miss===0?3:B.miss===1?2:1,before=starsOf(u.id);
  if(stars>before){prog[u.id]=stars;save()}
  const firstFriend=before===0,newShiny=stars===3&&before<3;
  setTimeout(()=>{
    confetti();
    const list=UNITS.filter(x=>x.g===u.g),idx=list.indexOf(u),nxt=list[idx+1];
    document.getElementById('result').innerHTML=`
      <div style="font-size:15px;color:var(--teal)">${u.t}</div>
      <h2>${stars===3?'パーフェクト！':'クリア！'}</h2>
      <div class="bigstars">${[1,2,3].map(n=>`<span class="${n<=stars?'on':''}" style="animation-delay:${n*.18}s">${IC.star}</span>`).join('')}</div>
      ${firstFriend||newShiny?`<div class="newfriend">${monSVG(u,stars===3)}<div><b>${u.m}${newShiny&&!firstFriend?'が キラキラに！':'が なかまになった！'}</b><small>${stars===3?'ノーミスで キラキラのすがたに！':'ノーミスで クリアすると キラキラのすがたになるよ。'}なかまずかんで 見てみよう。</small></div></div>`:''}
      ${nxt?`<button class="next go" onclick="openLesson(${nxt.id})">つぎのステージへ ▶</button>`:`<button class="next go" onclick="openMap(${u.g})">${u.g}ねんせい コンプリート！</button>`}
      ${stars<3?`<button class="btn2" onclick="startBattle()">もういちど（★3をめざす）</button>`:''}
      <button class="btn2" onclick="openMap(${u.g})">ステージいちらんへ</button>`;
    go('sResult');
  },650);
}
